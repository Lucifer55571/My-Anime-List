{% extends "base.html" %}

{% block title %}Profil - YourAnimeJourney{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center mt-4">
            <i class="bi bi-person-circle" style="font-size: 4rem; color: #6f42c1;"></i>
            <h3 class="fw-bold mt-3 mb-0">{{ current_user.username }}</h3>
            <p class="text-muted">{{ current_user.email }}</p>

            <hr>

            <h2 class="fw-bold mb-0">{{ total }}</h2>
            <p class="text-muted">Total Anime Tercatat</p>

            <a href="{{ url_for('anime_list') }}" class="btn btn-primary mt-2">
                <i class="bi bi-collection-play"></i> Lihat Daftar Anime
            </a>
        </div>
    </div>
</div>
{% endblock %}
