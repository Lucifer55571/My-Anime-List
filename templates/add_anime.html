{% extends "base.html" %}

{% block title %}Tambah Anime - MyAnimeTracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <h3 class="fw-bold mb-4">
                <i class="bi bi-plus-circle"></i> Tambah Anime Baru
            </h3>

            <form method="POST" action="{{ url_for('add_anime') }}">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label for="title" class="form-label">Judul Anime</label>
                        <input type="text" class="form-control" id="title" name="title" required autofocus>
                    </div>

                    <div class="col-md-4">
                        <label for="release_year" class="form-label">Tahun Rilis</label>
                        <input type="number" class="form-control" id="release_year" name="release_year"
                               min="1960" max="2100" required>
                    </div>

                    <div class="col-md-6">
                        <label for="genre" class="form-label">Genre</label>
                        <input type="text" class="form-control" id="genre" name="genre"
                               placeholder="Contoh: Action, Fantasy" required>
                    </div>

                    <div class="col-md-6">
                        <label for="studio" class="form-label">Studio</label>
                        <input type="text" class="form-control" id="studio" name="studio" required>
                    </div>

                    <div class="col-md-4">
                        <label for="episodes" class="form-label">Jumlah Episode</label>
                        <input type="number" class="form-control" id="episodes" name="episodes" min="0" required>
                    </div>

                    <div class="col-md-4">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Watching">Watching</option>
                            <option value="Completed">Completed</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Dropped">Dropped</option>
                            <option value="Plan to Watch">Plan to Watch</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="score" class="form-label">Skor (0-10)</label>
                        <input type="number" class="form-control" id="score" name="score"
                               min="0" max="10" step="0.1" required>
                    </div>

                    <div class="col-12">
                        <label for="cover_url" class="form-label">URL Gambar Cover</label>
                        <input type="url" class="form-control" id="cover_url" name="cover_url"
                               placeholder="https://...">
                    </div>

                    <div class="col-12">
                        <label for="synopsis" class="form-label">Sinopsis</label>
                        <textarea class="form-control" id="synopsis" name="synopsis" rows="4" required></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Simpan
                    </button>
                    <a href="{{ url_for('anime_list') }}" class="btn btn-outline-secondary">
                        Batal
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
